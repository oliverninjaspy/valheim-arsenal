plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

base {
	archivesName = 'valheim-arsenal'
}

repositories {
	// Loom adds the Minecraft and Fabric repositories automatically.
	// TerraBlender (used to add the Mistlands to the overworld) is published here.
	maven {
		name = 'Glitchfiend'
		url = 'https://maven.minecraftforge.net/'
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"valheim_arsenal" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// TerraBlender, bundled inside our jar ("include") so players only need Valheim Arsenal + Fabric API.
	implementation "com.github.glitchfiend:TerraBlender-fabric:${project.terrablender_version}"
	include "com.github.glitchfiend:TerraBlender-fabric:${project.terrablender_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
